name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime-packaging:
    name: runtime channel and artifact checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/test_runtime_bundle.py

  # INF-04 guard: this repo is release-only. No Rust source may ship in
  # any release artifact, so no tracked `*.rs` or `Cargo.toml`/`Cargo.lock`
  # is permitted OUTSIDE the narrow `scripts/` operator-tooling carve-out
  # (CLAUDE.md "Conventions": small Rust helpers with their own Cargo.toml,
  # never referenced by a release workflow, are allowed under scripts/).
  # A reappearing `crates/` or workspace Cargo.toml is exactly the
  # silent-stale-cascade drift the 2026-05-21 carve-out eliminated; fail
  # the build loudly if it returns.
  no-rust-source:
    name: no rust source outside scripts/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert no tracked Rust source outside scripts/
        shell: bash
        run: |
          set -euo pipefail
          # git ls-files is authoritative: only tracked files matter for
          # what ships. Exclude the sanctioned scripts/ helper tree.
          offenders=$(git ls-files -- '*.rs' 'Cargo.toml' 'Cargo.lock' '**/Cargo.toml' '**/Cargo.lock' \
            | grep -v -E '^scripts/' || true)
          if [[ -n "$offenders" ]]; then
            echo "::error::Rust source / cargo manifests found outside scripts/ in a release-only repo:"
            while IFS= read -r line; do echo "  - ${line}"; done <<< "$offenders"
            echo "This repo ships no Rust source (CLAUDE.md invariant). Move source to a"
            echo "sibling repo and publish to cargo.hawcx.com; install via cargo install --registry hawcx."
            exit 1
          fi
          echo "OK: no tracked Rust source outside scripts/."

  node:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install + typecheck + test
        working-directory: node
        run: |
          npm ci
          npm run typecheck
          npm test

  helm-chart:
    name: agent-pod chart (lint + render + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install helm + kubeconform (pinned versions)
        shell: bash
        run: |
          set -euo pipefail
          HELM_VERSION=v3.16.3
          KUBECONFORM_VERSION=v0.6.7
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/
          python -m pip install --upgrade pip
          python -m pip install pyyaml
      - name: Lint + render + schema-validate + structural-validate
        shell: bash
        run: bash deploy/agent-pod/ci/render_and_validate.sh

  # WHY A JOB AND NOT A TEST
  # -----------------------
  # #118 passed all 73 egress tests and broke every frozen agent bundle in the
  # field. It replaced a literal `import httpx` with
  # `importlib.import_module(<runtime value>)`; PyInstaller's module graph
  # follows the first and cannot see the second, so the transport stopped being
  # packaged and `client()` raised at the agent's first request. Measured after
  # the fact, same PyInstaller config, only the SDK differing:
  #
  #     pre-#118   httpx modules collected: 23   frozen result: works
  #     0.1.11     httpx modules collected:  0   frozen result: EgressConfigError
  #
  # No test could see it: every test imports the shim from a normal interpreter,
  # where `find_spec` finds whatever pip installed. The only thing that catches
  # it is freezing a program and running it, which needs PyInstaller and ~40s —
  # too slow and too heavy for the 12-cell `python` matrix above.
  #
  # ARMED, not decorative: run against 0.1.11 this job fails with the customer's
  # exact error. It is behavioural on purpose — it does not assert which modules
  # were collected, because the right answer changed (0.1.12 resolves to the
  # stdlib flavor in a frozen bundle, and that is correct). What must hold is
  # that a frozen program can get a working client from the broker.
  #
  # ubuntu only: `--onefile` collection is static analysis of the same module
  # graph everywhere, and the AF_UNIX broker this needs has no Windows analogue.
  frozen-bundle:
    name: frozen bundle can still reach the broker (${{ matrix.extras || 'no httpx lineage' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both halves matter. Without a lineage installed, the stdlib fallback
        # is the only thing that can work. With httpx2 installed but not
        # collected -- the exact #118 shape -- a build that silently loses the
        # transport must still fail here.
        extras: ["", "httpx2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Freeze the shim and make it talk to a broker
        working-directory: python
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .
          # cryptography mints the in-test localhost cert; pyinstaller is pinned
          # so a collection-behaviour change upstream is a deliberate bump here
          # rather than a mystery failure on an unrelated PR.
          python -m pip install 'pyinstaller==6.22.0' cryptography
          if [ -n "${{ matrix.extras }}" ]; then
            python -m pip install '${{ matrix.extras }}>=2.0.0'
          fi
          python tests/frozen/check_frozen_bundle.py

  python:
    name: python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # The Python package is pure-Python (hatchling backend). The bundled
      # hawcx-manager binary ships only in the release platform wheels, so the
      # editable dev install needs NO Rust toolchain and NO cargo registry.
      # Fetch the CANONICAL agent-template vector set so
      # tests/test_template_conformance.py runs instead of skipping. That module
      # is the only cross-repo proof that this SDK's validator agrees with the
      # reference oracle in hx_agent_canonical_spec; skipped, it proves nothing.
      #
      # ONE FILE over the API, not `actions/checkout` of the whole spec repo:
      # checkout must land inside $GITHUB_WORKSPACE, which would drop an
      # untracked sibling tree into this repo's working copy and put it in scope
      # for the other jobs' tree scans. Fetching the single JSON into a temp dir
      # shaped like the spec repo keeps this job self-contained.
      #
      # `continue-on-error` + the empty-token guard: HAWCX_GH_TOKEN is not yet a
      # secret on this repo (only CARGO_HAWCX_TOKEN and GITHUB_TOKEN are, and
      # GITHUB_TOKEN cannot read a different private repo). Until it is added the
      # step no-ops and the conformance module skips with its own loud reason.
      # It starts working the moment the secret lands — no code change needed.
      - name: Fetch the canonical agent-template vector set
        id: oracle
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HAWCX_GH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "HAWCX_GH_TOKEN not set on this repo — conformance vectors unavailable."
            echo "tests/test_template_conformance.py will SKIP (not silently pass)."
            exit 1
          fi
          rel="spec/conformance/vectors/agent-template-v1.json"
          dest="${RUNNER_TEMP}/canonical_spec/${rel}"
          mkdir -p "$(dirname "$dest")"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/hawcx/hx_agent_canonical_spec/contents/${rel}" \
            -o "$dest"
          # Reject an HTML error page or a truncated body before the tests read it:
          # a malformed oracle would surface as dozens of confusing vector
          # failures instead of one clear fetch failure.
          python -c "import json,sys; d=json.load(open(sys.argv[1])); assert d.get('vectors'), 'no vectors in fetched file'" "$dest"
          echo "HAWCX_CANONICAL_SPEC=${RUNNER_TEMP}/canonical_spec" >> "$GITHUB_ENV"
          echo "fetched $(python -c "import json,sys;print(len(json.load(open(sys.argv[1]))['vectors']))" "$dest") vectors"

      - name: Install + test
        working-directory: python
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          pytest -v
