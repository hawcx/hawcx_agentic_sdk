name: release-node

on:
  push:
    tags:
      - "node-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without leading node-v)"
        required: true

# INF-01: single source of truth for the bundled hawcx-manager crate
# version. Keep in lockstep with release.yml, release-python.yml, CLAUDE.md,
# and the hawcx-manager workspace version in hx_agent_client_auth_service.
env:
  HAWCX_MANAGER_VERSION: "0.8.8"

jobs:
  build-binary:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            platform_pkg: linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            platform_pkg: linux-arm64
          - target: aarch64-apple-darwin
            os: macos-14
            platform_pkg: darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform_pkg: win32-x64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            platform_pkg: win32-arm64
            # Cross-compiled on an x86_64 Windows runner (no native ARM64
            # Windows runner here): the resulting binary cannot be executed,
            # so the version-assert below skips the exec check (mirrors
            # release-python.yml #53).
            cross: true

    steps:
      # ── Cache key resolution ────────────────────────────────────────────────
      # For tag pushes  : key = "node-v0.1.0-alpha.12"  (the tag name)
      # For workflow_dispatch: key = the `version` input
      # Same key → same hawcx-manager release → skip the full Rust build.
      - name: Resolve binary cache key
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "key=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "key=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # ── Binary cache restore ────────────────────────────────────────────────
      # Exact-match only — no restore-keys fallback so a stale binary from a
      # prior version is never silently reused for a new release.
      - name: Restore cached hawcx-manager binary
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/staging/bin
          key: hawcx-manager-${{ matrix.target }}-${{ steps.ver.outputs.key }}

      # ── Build (skipped entirely on cache hit) ───────────────────────────────
      - name: Install Rust toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch head
        with:
          targets: ${{ matrix.target }}

      - name: Install protoc
        if: steps.cache.outputs.cache-hit != 'true'
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: '25.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux system deps
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Configure hawcx cargo registry
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          CARGO_HAWCX_TOKEN: ${{ secrets.CARGO_HAWCX_TOKEN }}
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml <<'EOF'
          [registries.hawcx]
          index = "sparse+https://cargo.hawcx.com/api/v1/crates/"

          [registry]
          global-credential-providers = ["cargo:token"]
          EOF
          cat > ~/.cargo/credentials.toml <<EOF
          [registries.hawcx]
          token = "${CARGO_HAWCX_TOKEN}"
          EOF
          chmod 600 ~/.cargo/credentials.toml

      # INF-01: exact-version pin (=X.Y.Z) + --locked so the binary bundled
      # into the npm platform packages is deterministically tied to one
      # hawcx-manager source version.
      - name: Install hawcx-manager from hawcx registry
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # --force: a restored-but-stale staging dir (partial cache key match,
          # cache-hit=false) can already contain the binary; without --force
          # cargo errors "binary already exists in destination". The exact
          # version pin + --locked guarantee the re-install is byte-identical.
          cargo install hawcx-manager \
            --registry hawcx \
            --version "=${HAWCX_MANAGER_VERSION}" \
            --target ${{ matrix.target }} \
            --root "${RUNNER_TEMP}/staging" \
            --locked \
            --force

      # INF-01: assert the installed binary reports the pinned version.
      - name: Assert installed hawcx-manager version
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          BIN="${RUNNER_TEMP}/staging/bin/hawcx-manager"
          [[ "${{ runner.os }}" == "Windows" ]] && BIN="${BIN}.exe"
          if [[ ! -s "$BIN" ]]; then
            echo "::error::hawcx-manager binary missing or empty at $BIN"
            exit 1
          fi
          # Cross-compiled targets (e.g. aarch64-pc-windows-msvc built on an
          # x86_64 runner) cannot be executed here. The exact version is already
          # guaranteed by `cargo install --version="=X.Y.Z" --locked` above, so
          # assert the artifact exists and skip the exec-based check.
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            echo "cross-compiled ${{ matrix.target }}: artifact present ($(wc -c < "$BIN") bytes); skipping exec-based version check"
            exit 0
          fi
          got="$("$BIN" --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?' | head -n1)"
          echo "installed hawcx-manager version: ${got} (expected ${HAWCX_MANAGER_VERSION})"
          if [[ "${got}" != "${HAWCX_MANAGER_VERSION}" ]]; then
            echo "::error::hawcx-manager version mismatch: got '${got}', expected '${HAWCX_MANAGER_VERSION}'"
            exit 1
          fi

      # Save only on a successful fresh build — a failed build must not
      # poison the cache for subsequent retries.
      - name: Save hawcx-manager binary to cache
        if: steps.cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/staging/bin
          key: hawcx-manager-${{ matrix.target }}-${{ steps.ver.outputs.key }}

      # ── Always upload artifact (whether from cache or fresh build) ──────────
      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.platform_pkg }}
          path: |
            ${{ runner.temp }}/staging/bin/hawcx-manager
            ${{ runner.temp }}/staging/bin/hawcx-manager.exe
          if-no-files-found: warn

  test-matrix:
    name: test node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install + typecheck + test
        working-directory: node
        run: |
          npm install --no-package-lock
          npm run typecheck
          npm test

  publish-platform-packages:
    name: publish ${{ matrix.platform_pkg }}
    needs: [build-binary, test-matrix]
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_pkg: linux-x64
            binary_name: hawcx-manager
          - platform_pkg: linux-arm64
            binary_name: hawcx-manager
          - platform_pkg: darwin-arm64
            binary_name: hawcx-manager
          - platform_pkg: win32-x64
            binary_name: hawcx-manager.exe
          - platform_pkg: win32-arm64
            binary_name: hawcx-manager.exe

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-${{ matrix.platform_pkg }}
          path: binary/
      - name: Resolve publish version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#node-v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Stage binary into platform package
        shell: bash
        run: |
          BINARY_SRC="binary/${{ matrix.binary_name }}"
          if [[ ! -f "$BINARY_SRC" ]]; then
            echo "Binary not found: $BINARY_SRC"
            exit 1
          fi
          cp "$BINARY_SRC" "node/platforms/${{ matrix.platform_pkg }}/${{ matrix.binary_name }}"
          chmod +x "node/platforms/${{ matrix.platform_pkg }}/${{ matrix.binary_name }}" || true
          # Stamp the resolved version into the platform package.json so npm
          # publishes the right version rather than whatever is committed in git.
          node -e "
            const fs = require('fs');
            const p = 'node/platforms/${{ matrix.platform_pkg }}/package.json';
            const pkg = JSON.parse(fs.readFileSync(p));
            pkg.version = '${{ steps.ver.outputs.version }}';
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
            console.log('Stamped', p, 'to', pkg.version);
          "
      - name: Publish platform package
        working-directory: node/platforms/${{ matrix.platform_pkg }}
        run: |
          # Stable versions (no prerelease suffix, e.g. 0.1.0) publish under the
          # default `latest` dist-tag; prereleases (e.g. 0.1.0-alpha.17, which
          # contain a `-`) publish under `alpha` so they never become the
          # default `npm install` target.
          VER="${{ steps.ver.outputs.version }}"
          if [[ "$VER" == *-* ]]; then DIST_TAG=alpha; else DIST_TAG=latest; fi
          echo "publishing ${VER} under dist-tag: ${DIST_TAG}"
          out=$(npm publish --provenance --access public --tag "$DIST_TAG" 2>&1) && echo "$out" || {
            echo "$out"
            echo "$out" | grep -q "cannot publish over the previously published versions" \
              && echo "Already published — skipping." \
              || exit 1
          }
        # Authentication via npm Trusted Publishing (OIDC). No stored token
        # needed — npm exchanges the GitHub id-token for a publish credential
        # at runtime. Trusted publisher must be configured on npmjs.com for
        # each @hawcx/* package (Settings → Publishing Access → Add Trusted
        # Publisher: owner=hawcx repo=hawcx_agentic_sdk workflow=release-node.yml
        # environment=npm-production).

  publish-main:
    name: publish @hawcx/hawcx-haap
    needs: [publish-platform-packages]
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
      - name: Resolve publish version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#node-v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Stamp version + install + build
        working-directory: node
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            pkg.version = '${{ steps.ver.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('Stamped package.json to', pkg.version);
          "
          npm install --omit=optional --no-package-lock
          npm run build
      - name: Publish
        working-directory: node
        run: |
          # Stable → `latest`, prerelease (version contains `-`) → `alpha`.
          VER="${{ steps.ver.outputs.version }}"
          if [[ "$VER" == *-* ]]; then DIST_TAG=alpha; else DIST_TAG=latest; fi
          echo "publishing ${VER} under dist-tag: ${DIST_TAG}"
          out=$(npm publish --provenance --access public --tag "$DIST_TAG" 2>&1) && echo "$out" || {
            echo "$out"
            echo "$out" | grep -q "cannot publish over the previously published versions" \
              && echo "Already published — skipping." \
              || exit 1
          }
        # Authentication via npm Trusted Publishing (OIDC) — same as above.
      - name: Move latest tag (stable only)
        working-directory: node
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          # Only stable releases (no prerelease suffix) may own `latest`.
          # Publishing with `--tag latest` above already sets it for stable;
          # this is the explicit guard so a prerelease never moves `latest`
          # (which would make `npm install <pkg>` resolve to an alpha).
          if [[ "$VER" == *-* ]]; then
            echo "prerelease ${VER} — leaving 'latest' untouched"
          else
            npm dist-tag add "${PKG}@${VER}" latest
          fi
